name: Turso

on:
  pull_request:
    paths:
      - 'packages/database/turso/**'
  push:
    branches:
      - main
    paths:
      - 'packages/database/turso/**'

permissions:
  contents: read

jobs:
  turso-linux:
    if: false # Temporarily disabled while the Windows runner is isolated.
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3
      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Verify packaged Linux SDK artifact
        run: echo 'c61e84f96d41c2b58f7f016e3d5496b501581719092fcf0d942699e725736d47  packages/database/turso/native/linux/x64/libturso_sdk_kit.so' | sha256sum --check
      - name: Run Turso engine tests
        working-directory: packages/database/turso
        run: dart test test --chain-stack-traces
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build and run Linux Flutter application
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev ninja-build xvfb
          flutter create --empty --platforms=linux "$RUNNER_TEMP/turso_smoke"
          cd "$RUNNER_TEMP/turso_smoke"
          flutter pub add turso --path "$GITHUB_WORKSPACE/packages/database/turso"
          cp "$GITHUB_WORKSPACE/packages/database/turso/tool/flutter_smoke_main.dart.template" lib/main.dart
          flutter build linux --release
          xvfb-run --auto-servernum build/linux/x64/release/bundle/turso_smoke
          test -f build/linux/x64/release/bundle/turso-flutter-smoke/PASS

      - name: Verify packaged Android SDK artifacts
        run: |
          echo '37ca19e7752429b1df92e5370515689c5cdeb861dfc39954abd5e29d911bcbba  packages/database/turso/native/android/arm64/libturso_sdk_kit.so' | sha256sum --check
          echo 'be8eaf44e2072424512c920e981696a85dd078b8f1a7204f329a3802b1bed41a  packages/database/turso/native/android/x64/libturso_sdk_kit.so' | sha256sum --check
          for library in packages/database/turso/native/android/*/libturso_sdk_kit.so; do
            readelf -lW "$library" | awk '/LOAD/ && $NF != "0x4000" { exit 1 }'
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          script: bash "$GITHUB_WORKSPACE/packages/database/turso/tool/verify_android.sh"

      - name: Build the browser verification application
        working-directory: packages/database/turso
        run: |
          dart run tool/install_web.dart example/web/turso
          dart compile js example/web/main.dart -O1 -o example/web/main.dart.js
      - name: Install the browser driver
        run: |
          python3 -m venv "$RUNNER_TEMP/turso-selenium"
          "$RUNNER_TEMP/turso-selenium/bin/pip" install selenium
      - name: Run the complete Chrome and Firefox contracts
        working-directory: packages/database/turso
        run: |
          google-chrome --version
          firefox --version
          dart run tool/serve_web_example.dart 8080 > "$RUNNER_TEMP/turso-web-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          SERVER_READY=false
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080 > /dev/null; then
              SERVER_READY=true
              break
            fi
            sleep 1
          done
          if [[ "$SERVER_READY" != true ]]; then
            cat "$RUNNER_TEMP/turso-web-server.log"
          fi
          curl --fail --head http://localhost:8080
          "$RUNNER_TEMP/turso-selenium/bin/python" tool/run_web_verification.py chrome
          "$RUNNER_TEMP/turso-selenium/bin/python" tool/run_web_verification.py firefox

  turso-windows:
    runs-on: blacksmith-2vcpu-windows-2025

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3
      - name: Resolve workspace dependencies
        run: dart pub get
      - name: Verify packaged Windows SDK artifact
        shell: pwsh
        run: |
          $actual = (Get-FileHash packages/database/turso/native/windows/x64/turso_sdk_kit.dll -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne 'd98951e2cc584ac98a2ada9f839a5901267c6fc0ee23eceed27b22393e51a60d') {
            throw "Unexpected Turso SDK hash: $actual"
          }
      - name: Run Turso engine tests
        working-directory: packages/database/turso
        run: dart test test --chain-stack-traces
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install the Visual C++ runtime
        shell: pwsh
        run: choco install vcredist140 --yes --no-progress
      - name: Build and run Windows Flutter application
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'turso_smoke'
          flutter create --empty --platforms=windows $smokeRoot
          Push-Location $smokeRoot
          flutter pub add turso --path "$env:GITHUB_WORKSPACE/packages/database/turso"
          Copy-Item "$env:GITHUB_WORKSPACE/packages/database/turso/tool/flutter_smoke_main.dart.template" lib/main.dart
          flutter build windows --release
          $releaseRoot = "$smokeRoot/build/windows/x64/runner/Release"
          & "$env:GITHUB_WORKSPACE/packages/database/turso/tool/diagnose_windows.ps1" -Bundle $releaseRoot
          $process = Start-Process "$releaseRoot/turso_smoke.exe" -WorkingDirectory $releaseRoot -ArgumentList '--enable-software-rendering' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            $exitCode = $process.ExitCode
            Write-Host "Turso Flutter smoke process exited with $exitCode (0x$($exitCode.ToString('X8')))."
            $errorPath = "$releaseRoot/TURSO_ERROR"
            if (Test-Path $errorPath) {
              Get-Content $errorPath
            }
            throw "Turso Flutter smoke process failed."
          }
          if (-not (Test-Path "$releaseRoot/turso-flutter-smoke/PASS")) {
            throw 'Turso Flutter smoke check failed.'
          }

  turso-apple:
    if: false # Temporarily disabled while the Windows runner is isolated.
    runs-on: blacksmith-6vcpu-macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3
      - name: Resolve workspace dependencies
        run: dart pub get
      - name: Verify packaged macOS SDK artifact
        run: echo '3fbb42e1e77acb7869615a5e5d5f18e5a13bbb167be22630f23d97b9e17a1c25  packages/database/turso/native/macos/arm64/libturso_sdk_kit.dylib' | shasum -a 256 --check
      - name: Run the complete Turso native contract
        working-directory: packages/database/turso
        run: dart test test --chain-stack-traces

      - name: Verify packaged iOS SDK artifacts
        run: |
          echo 'bafa6b5e291b3ee4b4a94a05a1e0a9e704cd19ca4a30f1afae6d52c6acbbded2  packages/database/turso/native/ios/device/arm64/libturso_sdk_kit.dylib' | shasum -a 256 --check
          echo '1f63adf5b46b706c2845510faa544c3e980b391cd37033f07e2b122586b349ed  packages/database/turso/native/ios/simulator/arm64/libturso_sdk_kit.dylib' | shasum -a 256 --check
          echo '31b78f2cbd83c49f9b393c58d120dfe9ec14d8e67774d56c3898e677174f3910  packages/database/turso/native/ios/simulator/x64/libturso_sdk_kit.dylib' | shasum -a 256 --check
      - name: Prepare iOS verification application
        run: |
          flutter create --empty --platforms=ios "$RUNNER_TEMP/turso_mobile"
          cd "$RUNNER_TEMP/turso_mobile"
          flutter pub add turso --path "$GITHUB_WORKSPACE/packages/database/turso"
          flutter pub add 'dev:integration_test@{"sdk":"flutter"}'
          mkdir -p integration_test
          cp "$GITHUB_WORKSPACE/packages/database/turso/tool/flutter_native_runtime_test.dart.template" integration_test/runtime_test.dart
      - name: Boot an iOS simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$DEVICE_ID"
          echo "IOS_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          flutter devices
      - name: Run iOS simulator tests
        working-directory: ${{ runner.temp }}/turso_mobile
        timeout-minutes: 20
        run: flutter test integration_test/runtime_test.dart -d "$IOS_DEVICE_ID"
      - name: Build the iOS device application
        working-directory: ${{ runner.temp }}/turso_mobile
        run: |
          xcrun simctl shutdown "$IOS_DEVICE_ID"
          flutter build ios --release --no-codesign
      - name: Verify the packaged iOS device artifact
        working-directory: ${{ runner.temp }}/turso_mobile
        run: |
          find build/ios/iphoneos/Runner.app -path '*turso_sdk_kit.framework/turso_sdk_kit' \
            -exec file {} \; | grep 'arm64'

      - name: Build the browser verification application
        working-directory: packages/database/turso
        run: |
          dart run tool/install_web.dart example/web/turso
          dart compile js example/web/main.dart -O1 -o example/web/main.dart.js
      - name: Enable Safari automation
        run: |
          sudo safaridriver --enable
          safaridriver --version
      - name: Install the browser driver
        run: |
          python3 -m venv "$RUNNER_TEMP/turso-selenium"
          "$RUNNER_TEMP/turso-selenium/bin/pip" install selenium
      - name: Run the complete Safari contract
        working-directory: packages/database/turso
        run: |
          dart run tool/serve_web_example.dart 8080 > "$RUNNER_TEMP/turso-web-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          SERVER_READY=false
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080 > /dev/null; then
              SERVER_READY=true
              break
            fi
            sleep 1
          done
          if [[ "$SERVER_READY" != true ]]; then
            cat "$RUNNER_TEMP/turso-web-server.log"
          fi
          curl --fail --head http://localhost:8080
          "$RUNNER_TEMP/turso-selenium/bin/python" tool/run_web_verification.py safari
