name: Dart

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  RIVET_POSTGRES_IMAGE: 590183900818.dkr.ecr.ap-south-1.amazonaws.com/inframe/postgres@sha256:a29d81973c699fdf070b10f77bf5b91b1d94a59fcd7792f67410ba655761f871

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Generate Rivet consumer fixtures
        run: |
          (cd packages/database/rivet && dart run build_runner build --build-filter=test/generated_consumer.rivet.dart)
          dart format packages/database/rivet/test/generated_consumer.rivet.dart
          (cd packages/database/rivet/test/fixtures/schema_package && dart run build_runner build)
          dart format packages/database/rivet/test/fixtures/schema_package/lib/package_users.rivet.dart
          (cd packages/database/rivet/test/fixtures/app_package && dart run build_runner build)
          dart format packages/database/rivet/test/fixtures/app_package/lib/app_database.rivet.dart
          git diff --exit-code

      - name: Generate Voxel consumer fixtures
        working-directory: packages/database/voxel
        run: |
          dart run build_runner build
          dart format .
          git diff --exit-code

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run Rivet generator and cross-package tests
        run: |
          dart test packages/database/rivet/rivet_generator/test --chain-stack-traces
          dart test packages/database/rivet/test/fixtures/app_package/test --chain-stack-traces

      - name: Run Voxel generator and codec tests
        working-directory: packages/database/voxel
        run: |
          dart test --chain-stack-traces
          dart test voxel_generator/test --chain-stack-traces

      - name: Run context tests and consumer checks
        run: dart test packages/context/test --chain-stack-traces

      - name: Run Inlet tests and examples
        run: |
          dart test packages/inlet/test --chain-stack-traces
          dart run packages/inlet/example/inlet_example.dart
          dart run packages/inlet/example/stream_transfers.dart
          dart run packages/inlet/example/live_events.dart
          dart run packages/inlet/example/web_socket_chat.dart

      - name: Run Conflux tests and consumer checks
        run: |
          dart test packages/conflux/conflux/test --chain-stack-traces
          dart test packages/conflux/chronicler_conflux/test --chain-stack-traces

      - name: Run Artificer provider-core tests and example
        run: |
          dart test packages/artificer/providers/artificer_core/test --chain-stack-traces
          dart run packages/artificer/providers/artificer_core/example/text_generation.dart

      - name: Run Artificer Google provider tests and example
        run: |
          dart test packages/artificer/providers/artificer_google/test --chain-stack-traces
          dart run packages/artificer/providers/artificer_google/example/text_generation.dart

      - name: Run Baseten provider tests and example
        run: |
          dart test packages/artificer/providers/artificer_baseten/test --chain-stack-traces
          dart run packages/artificer/providers/artificer_baseten/example/text_generation.dart

      - name: Run xAI provider tests and example
        run: |
          dart test packages/artificer/providers/artificer_xai/test --chain-stack-traces
          dart run packages/artificer/providers/artificer_xai/example/text_generation.dart

      - name: Run Anthropic provider tests and example
        run: |
          dart test packages/artificer/providers/artificer_anthropic/test --chain-stack-traces
          dart run packages/artificer/providers/artificer_anthropic/example/text_generation.dart
          dart run packages/artificer/providers/artificer_anthropic/example/tool_turn.dart
          dart run packages/artificer/providers/artificer_anthropic/example/models_and_tokens.dart
          dart run packages/artificer/providers/artificer_anthropic/example/files.dart

      - name: Run Chrono ID tests
        run: |
          dart test packages/chrono_id/chrono_id/test --chain-stack-traces
          dart test packages/chrono_id/ack_chrono_id/test --chain-stack-traces

      - name: Run Chronicler tests
        run: dart test packages/chronicler/chronicler/test --chain-stack-traces

      - name: Run controlled HTTP tests
        run: dart test packages/database/clickhouse/test --exclude-tags integration --chain-stack-traces

      - name: Run Runnel unit tests
        run: dart test packages/database/runnel/test --exclude-tags integration --chain-stack-traces

      - name: Run JSON Patch tests on the Dart VM
        run: dart test packages/json_patch/test --chain-stack-traces

      - name: Run JSON Patch public example
        run: dart run packages/json_patch/example/json_patch_example.dart

      - name: Configure AWS credentials for the Rivet test image
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Run Rivet PostgreSQL integration tests
        env:
          RIVET_TEST_DATABASE_URL: postgresql://postgres:test-password@127.0.0.1:15432/inframe_test?sslmode=disable
          RIVET_TEST_TLS: '1'
        run: |
          echo "Rivet PostgreSQL image: $RIVET_POSTGRES_IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          docker pull "$RIVET_POSTGRES_IMAGE"
          docker run --detach --rm --name inframe-rivet-test \
            --publish 127.0.0.1:15432:5432 \
            --env POSTGRES_PASSWORD=test-password \
            --env POSTGRES_DB=inframe_test \
            "$RIVET_POSTGRES_IMAGE"
          trap 'docker stop inframe-rivet-test' EXIT
          for attempt in {1..60}; do
            if docker exec inframe-rivet-test psql \
              --username postgres --dbname inframe_test \
              --tuples-only --command 'SELECT 1'; then
              break
            fi
            sleep 1
          done
          docker exec inframe-rivet-test psql \
            --username postgres --dbname inframe_test \
            --tuples-only --command 'SELECT 1'
          (cd packages/database/rivet && dart test test/*_test.dart --chain-stack-traces)

      - name: Run ClickHouse integration tests
        env:
          CLICKHOUSE_URL: http://127.0.0.1:18123
          CLICKHOUSE_PASSWORD: test-password
          CLICKHOUSE_ALLOW_INSECURE_HTTP: 'true'
        run: |
          docker run --detach --rm --name inframe-clickhouse-test \
            --publish 127.0.0.1:18123:8123 \
            --env CLICKHOUSE_PASSWORD=test-password \
            clickhouse:26.8.2.7@sha256:2c0ce0d50655752e01b859cbbaf275f6c8009be7178e48e9113b060cb472bf25
          trap 'docker stop inframe-clickhouse-test' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              --user default:test-password \
              http://127.0.0.1:18123/ping; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            --user default:test-password \
            http://127.0.0.1:18123/ping
          dart test packages/database/clickhouse/test/integration --chain-stack-traces

      - name: Run Runnel integration tests
        run: packages/database/runnel/tool/run_integration.sh
