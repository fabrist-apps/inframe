name: Dart

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run context tests and consumer checks
        run: dart test packages/context/test --chain-stack-traces

      - name: Run Inlet tests and examples
        run: |
          dart test packages/inlet/test --chain-stack-traces
          dart run packages/inlet/example/inlet_example.dart
          dart run packages/inlet/example/stream_transfers.dart
          dart run packages/inlet/example/live_events.dart
          dart run packages/inlet/example/web_socket_chat.dart

      - name: Run Conflux tests and consumer checks
        run: dart test packages/conflux/test --chain-stack-traces

      - name: Run Chrono ID tests
        run: |
          dart test packages/chrono_id/chrono_id/test --chain-stack-traces
          dart test packages/chrono_id/ack_chrono_id/test --chain-stack-traces

      - name: Run controlled HTTP tests
        run: dart test packages/database/clickhouse/test --exclude-tags integration --chain-stack-traces

      - name: Run JSON Patch tests on the Dart VM
        run: dart test packages/json_patch/test --chain-stack-traces

      - name: Run JSON Patch public example
        run: dart run packages/json_patch/example/json_patch_example.dart

      - name: Run ClickHouse integration tests
        env:
          CLICKHOUSE_URL: http://127.0.0.1:18123
          CLICKHOUSE_PASSWORD: test-password
          CLICKHOUSE_ALLOW_INSECURE_HTTP: 'true'
        run: |
          docker run --detach --rm --name inframe-clickhouse-test \
            --publish 127.0.0.1:18123:8123 \
            --env CLICKHOUSE_PASSWORD=test-password \
            clickhouse:26.8.2.7@sha256:2c0ce0d50655752e01b859cbbaf275f6c8009be7178e48e9113b060cb472bf25
          trap 'docker stop inframe-clickhouse-test' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              --user default:test-password \
              http://127.0.0.1:18123/ping; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            --user default:test-password \
            http://127.0.0.1:18123/ping
          dart test packages/database/clickhouse/test/integration --chain-stack-traces
