[package]
name = "turso_sql_guard"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
turso_parser = { git = "https://github.com/tursodatabase/turso.git", rev = "342dfbe267ebdb9141c434c499ce31e10bb46f27" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
