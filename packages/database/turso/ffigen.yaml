# yaml-language-server: $schema=https://raw.githubusercontent.com/dart-lang/ffigen/main/ffigen.schema.json

name: TursoNativeBindings
description: Generated bindings for the pinned Turso SDK kit C ABI.
ffi-native:
  asset-id: package:turso/src/native/turso_bindings_generated.dart
output: lib/src/native/turso_bindings_generated.dart
silence-enum-warning: true
headers:
  entry-points:
    - native/include/turso.h
  include-directives:
    - native/include/turso.h
functions:
  include:
    - turso_version
    - turso_setup
    - turso_database_new
    - turso_database_open
    - turso_database_connect
    - turso_connection_get_autocommit
    - turso_connection_prepare_single
    - turso_connection_prepare_first
    - turso_connection_close
    - turso_statement_.*
    - turso_str_deinit
    - turso_database_deinit
    - turso_connection_deinit
structs:
  include:
    - turso_config_t
    - turso_database_config_t
    - turso_database_t
    - turso_connection_t
    - turso_statement_t
enums:
  include:
    - turso_status_code_t
    - turso_type_t
comments:
  style: doxygen
  length: brief
